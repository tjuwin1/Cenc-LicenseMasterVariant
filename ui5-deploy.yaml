# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: customer-zlicense-variant
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
customConfiguration:
  adp:
    support:
      id: '@sap/generator-fiori'
      version: 1.30.0
      toolsId: 57ffc1b3-9fca-4ad2-8ab8-c82d3f5160e5
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        log: 5
        target:
          destination: CE1_130_BASIC
          url: http://abplatformdevce1.uspah.apps.cencora.com:443
        #  destination: BE2_130
        #  url: http://saps4hsbx.npd.amerisourcebergen.com:443
          client: '130'
        app:
          package: ZOTC_LIC
          transport: CE1K941782
        #  package: ZOTC1
        #  transport: BE2K904568
        exclude:
          - /test/
          - /localService/
        lrep: apps/fcg.sll.license.manages1/appVariants/customer.zlicense.variant/
